# 在 2566.online 的 443 server 块内 include 本文件
# include /etc/nginx/snippets/workboard-locations.conf;

location = /workboard { return 301 /workboard/; }
location = /workboard/ {
    auth_basic off;
    index index.html;
    alias /opt/workboard/www/;
    try_files index.html =404;
}
location ^~ /workboard/api/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8100/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
